org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Proyek masih pakai AGP 8.9.1 (DSL lama) sementara Flutter Gradle plugin
# bawaan SDK terbaru sudah berasumsi AGP 9+ (DSL baru) secara default.
# Flags ini TIDAK bisa dihapus selama AGP belum dinaikkan ke 9.x — tanpanya
# build gagal ("only the new DSL interface will be read").
android.builtInKotlin=false
android.newDsl=false
